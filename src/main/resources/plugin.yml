main: net.tfminecraft.tfmccore.TFMCCore
api-version: '1.21.10'
name: TFMCCore
version: ${project.version}
author: Drefvelin

depend: [TLibs]
softdepend: [VehicleFramework, RPCharacters, AdvancedCrafting, MythicLib, MMOCore, SimpleFactions, LuckPerms]

commands:
  tcore:
    description: TFMC Core command
    usage: /tcore reload [all|config|drops|stations|stats|focus|whistle|letters|lorestones] | /tcore stats <category> [player] | /tcore focus restore <player> | /tcore stones give <lorestone|namestone> [player] [amount]
    aliases: [tfmc]
  silentpermission:
    description: Set a LuckPerms user permission without console spam
    usage: /silentpermission <player|uuid> <permission> <true|false>
    permission: tfmccore.silentpermission

permissions:
  tfmccore.silentpermission:
    description: Set LuckPerms user permissions silently
    default: op
  tfmccore.admin:
    description: View other players' stats and server-wide totals
    default: op
  tfmccore.reload:
    description: Reload TFMCCore configs
    default: op
  tfmccore.stones.use:
    description: Use lorestones and namestones on items
    default: true
