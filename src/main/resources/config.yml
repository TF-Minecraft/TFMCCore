# Reduce client ZIP scans on formats 32-74 (1.20.5-1.21.10); applies on the next /iazip.
# Requires verified ItemsAdder 4.0.18; newer atlas-generation layers remain intact.
resource-pack:
  compact-overlays: true
  # Warn staff when the ItemsAdder pack holds a texture wider or taller than this many
  # pixels. Most Intel graphics can't load textures over 16384 px, and one such texture
  # stops the whole pack loading for those players. 0 turns the check off.
  max-texture-size: 16384
  # Send the pack as required when a player joins and publish its state as player
  # metadata (tfmccore:required-pack = loading, ready or failed) for RPCharacters.
  require-on-join: false
  # Opt-in. Requires ItemsAdder allow_other_plugins_resourcepacks: true.
  # Restart to change these settings; keep the existing ItemsAdder host for fallback.
  multipart:
    enabled: false
    port: 9981
    public-url: "http://127.0.0.1:9981/"

bone-meal: false
allow-brewing: false
allow-enchanting: false
limit-shields: true
horse-archery: false
prevent-golem-scrape: true
# Send Xaero's Minimap fair-play code (no entity radar or cave mode) on every join.
xaero-fair-play: true
# Hide the enchantment glint on signed books (letters and book skins too). Books are
# updated within a second in player inventories and when their container is opened.
# Updated books are tagged, so false brings back the glint on those the same way.
# ProtocolLib hides it on books not yet updated in item frames or on the ground.
hide-book-glint: true
# Let written books be copied with a Book and Quill at a crafting table. MMOItems
# otherwise blocks the vanilla recipe, because every Book and Quill is a disable-crafting MMOItem.
allow-book-copies: true
# Soul Speed I (+1 movement efficiency, +0.0405 speed) while standing on soul sand, checked
# every 5 ticks. false also takes it off anyone who still has it.
soul-sand-stride: false
# Make MythicLib's damage indicators show the health the target really lost after armour and
# anything else that cuts damage late, absorption hearts included. Each indicator appears one
# tick later; a killing blow shows the health that was left, a hit that took nothing shows
# nothing. false shows MythicLib's own number, which leaves armour out.
accurate-damage-indicators: true
# Healing on anyone under the Wounded status (a MythicMobs aura that TFMC class skills give)
# is multiplied by this: lifesteal, skill heals, regeneration and food alike. Absorption
# shields are not healing. 1 turns it off; it needs MythicMobs and MythicLib.
wounded-healing-multiplier: 0.5

drops-debug: true

armour-time: 7

