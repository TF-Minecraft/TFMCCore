        - "clear <player> white_carpet 1"
    thievery:
      name: Thievery
      clear:
        - "mi take LOCKPICKS BASIC_LOCKPICK <player> 1"
        - "mi take KEYS IRON_KEY <player> 1"
        - "clear <player> chest 1"
        - "rpcharacter removetrait <player> thief"
