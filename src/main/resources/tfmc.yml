# /tfmc parrot disguises the player as a parrot and lets them fly briefly; /tfmc unparrot ends it early.
parrot:
  enabled: false
  # Any of these; leave empty for everyone.
  permissions: []
  cooldown-seconds: 300
  duration-seconds: 20
  # Bukkit fly speed (default 0.1); 0.01 matches the old "flyspeed fly 0.1".
  fly-speed: 0.01
  disguise: "libsdisguises:disguiseplayer <player> parrot setVariant GRAY setExpires <seconds>s"
  undisguise: "libsdisguises:undisguiseplayer <player>"
  started: "<gray><i>You are now a <#eeeeee>Parrot"
  ended: "<gray><i>You are no longer a <#eeeeee>Parrot"
  already: "<red>You are already a parrot. Use <#eeeeee>/tfmc unparrot</#eeeeee> to stop."
  not-a-parrot: "<red>You are not a parrot."
  cooldown: "<red>You need to wait <yellow><time></yellow> before turning into a <#eeeeee><i>Parrot</i></#eeeeee> again."

worldboss:
  enabled: false
  info:
    - "<dark_purple>━━━━━━━━━━━━━━━"
    - "<aqua><b>TFMC Roleplay World Boss Info"
    - ""
    - "<yellow>There are several world bosses in TFMC. These are hard fights that can grant powerful loot. To start a boss fight you will need the corresponding boss ticket. Each person that wants to take part in the fight will need to use one."
    - ""
    - "<yellow>You can get the tickets in the Voting Crates. To use a ticket you will need to right click 2 times (2nd time to confirm). Once you are in the lobby before the fight, wait for everyone before pressing the soul lantern to start the fight."
    - ""
    - "<yellow>Each boss can only be fought by one group at the same time, so if there is no lantern you will need to wait for the current group to finish. There is no cooldown for fighting the different bosses, but you can always run into the danger of dying. (You can always use an Insurance Ticket if you die)."
    - "<dark_purple>━━━━━━━━━━━━━━━"
