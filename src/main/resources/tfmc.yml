# /tfmc tutorial <name> clear takes back the items a tutorial lantern handed out.
tutorials:
  enabled: false
  cooldown-seconds: 10
  cleared: "<gray><i>Cleared inventory of items from <name> Tutorial"
  unknown: "<red>There is no tutorial called <name>."
  list:
    archaeology:
      name: Archaeology
      clear:
        - "mi take TOOLS ARCHAEO_TRACKER <player> 1"
        - "mi take TOOLS ARCHAEO_PROSPECT <player> 1"
        - "mi take TOOLS ARCHAEO_ESTABLISH <player> 1"
        - "mi take TOOLS ARCHEOLOGY_HANDPICK <player> 1"
        - "mi take TOOLS ARCHAEO_PENCIL <player> 1"
        - "clear <player> brush 1"
        - "clear <player> paper 1"
        - "clear <player> water_bucket 1"
        - "clear <player> bucket 1"
        - "clear <player> feather 1"
        - "iaremove <player> tfmc:archeology_cabinet 1 silent"
    cooking:
      name: Cooking
      clear:
        - "clear <player> carrot 2"
        - "iaremove <player> tfmc_cooking:cutting_knife 1 silent"
        - "iaremove <player> tfmc_cooking:cutting_board 1 silent"
